[package]
name = "guardian-proxy"
version = "0.5.0"
edition = "2021"
rust-version = "1.85.0"
description = "Axum MITM proxy handlers, ProxyError, and AppState for LLM Firewall"
license = "MIT OR Apache-2.0"

[dependencies]
tokio-rustls = "0.26"
rustls = { version = "0.23", features = ["ring"] }
hyper = { version = "1", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
tower = "0.5"
rcgen = { version = "0.14.7", features = ["x509-parser"] }

guardian-core = { path = "../guardian-core", version = "0.5.0" }
axum = "0.8.9"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
futures-core = "0.3.32"
futures-util = "0.3"
bytes = "1"
url = "2.5.8"
form_urlencoded = "1.2.2"
aho-corasick = "1.1.3"
flate2 = "1.1.10"
regex = "1.13.1"
hex = "0.4.3"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.13.4", features = ["json", "stream"] }
serde_json = "1.0"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
