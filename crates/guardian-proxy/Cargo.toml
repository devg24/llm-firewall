[package]
name = "guardian-proxy"
version = "0.1.0"
edition = "2021"
rust-version = "1.85.0"
description = "Axum MITM proxy handlers, ProxyError, and AppState for LLM Firewall"
license = "MIT OR Apache-2.0"

[dependencies]
guardian-core = { path = "../guardian-core" }
axum = "0.8.9"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
futures-core = "0.3.32"
futures-util = "0.3"
bytes = "1"
url = "2.5.8"
form_urlencoded = "1.2.2"
aho-corasick = "1.1.3"

[dev-dependencies]
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.13.4", features = ["json", "stream"] }
serde_json = "1.0"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
