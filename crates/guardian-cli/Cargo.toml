[package]
name = "guardian-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.85.0"
description = "Command-line interface and entrypoint for LLM Firewall"
license = "MIT OR Apache-2.0"

[dependencies]
guardian-core = { path = "../guardian-core" }
guardian-proxy = { path = "../guardian-proxy" }
axum = "0.8.9"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13.4", features = ["json", "stream"] }

[dev-dependencies]
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
