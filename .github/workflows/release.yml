name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: llm-firewall-rs
            asset_name: llm-firewall-x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: llm-firewall-rs
            asset_name: llm-firewall-aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
            binary_name: llm-firewall-rs
            asset_name: llm-firewall-x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: llm-firewall-rs.exe
            asset_name: llm-firewall-x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package Binary (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          cp ${{ matrix.binary_name }} llm-firewall
          tar -czvf ../../../${{ matrix.asset_name }}.tar.gz llm-firewall
          cd ../../..
          shasum -a 256 ${{ matrix.asset_name }}.tar.gz > ${{ matrix.asset_name }}.tar.gz.sha256

      - name: Package Binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Copy-Item ${{ matrix.binary_name }} -Destination llm-firewall.exe
          Compress-Archive -Path llm-firewall.exe -DestinationPath ../../../${{ matrix.asset_name }}.zip
          cd ../../..
          Get-FileHash -Algorithm SHA256 ${{ matrix.asset_name }}.zip | ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } | Out-File -Encoding ascii ${{ matrix.asset_name }}.zip.sha256

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset_name }}.tar.gz
            ${{ matrix.asset_name }}.tar.gz.sha256
            ${{ matrix.asset_name }}.zip
            ${{ matrix.asset_name }}.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
