[package]
name = "llm-firewall-rs"
version = "0.5.0"
edition = "2021"
rust-version = "1.85.0"

[workspace]
members = [
    ".",
    "crates/guardian-core",
    "crates/guardian-proxy",
    "crates/guardian-cli",
]
resolver = "2"

[dependencies]
guardian-core = { path = "crates/guardian-core", version = "0.5.0" }
guardian-proxy = { path = "crates/guardian-proxy", version = "0.5.0" }
guardian-cli = { path = "crates/guardian-cli", version = "0.5.0" }
axum = "0.8.9"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
futures-core = "0.3.32"
candle-core = "0.10.2"
candle-nn = "0.10.2"
candle-transformers = "0.10.2"
regex = "1.12.4"
url = "2.5.8"
form_urlencoded = "1.2.2"
tokenizers = "0.22.2"
unicode-normalization = "0.1.25"

[profile.dev.package."*"]
opt-level = 3
[profile.dev.package.candle-core]
opt-level = 3
[profile.dev.package.candle-nn]
opt-level = 3
[profile.dev.package.candle-transformers]
opt-level = 3
[profile.dev.package.guardian-core]
opt-level = 3
[profile.dev.package.guardian-proxy]
opt-level = 3
[profile.dev.package.guardian-cli]
opt-level = 3

[profile.test.package."*"]
opt-level = 3
[profile.test.package.candle-core]
opt-level = 3
[profile.test.package.candle-nn]
opt-level = 3
[profile.test.package.candle-transformers]
opt-level = 3
[profile.test.package.guardian-core]
opt-level = 3
[profile.test.package.guardian-proxy]
opt-level = 3
[profile.test.package.guardian-cli]
opt-level = 3
