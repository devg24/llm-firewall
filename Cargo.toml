[package]
name = "llm-firewall-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.85.0"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13.4", features = ["json", "stream"] }
futures-core = "0.3.32"
candle-core = "0.10.2"
candle-nn = "0.10.2"
candle-transformers = "0.10.2"
regex = "1.12.4"
url = "2.5.8"
form_urlencoded = "1.2.2"
tokenizers = "0.22.2"

